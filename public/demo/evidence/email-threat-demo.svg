<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t"><title id="t">Synthetic threat email</title><rect width="720" height="480" fill="#f8f7f5"/><rect x="54" y="45" width="612" height="390" rx="18" fill="#fff" stroke="#ded9d7"/><text x="88" y="96" font-family="Arial,sans-serif" font-size="20" fill="#711522">SYNTHETIC EMAIL</text><text x="88" y="146" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">From: unknown.sender@example.invalid</text><line x1="88" y1="180" x2="632" y2="180" stroke="#ded9d7"/><text x="88" y="228" font-family="Arial,sans-serif" font-size="21" fill="#171717">The same threat was repeated by email.</text><rect x="88" y="268" width="440" height="18" rx="4" fill="#292929"/><rect x="88" y="302" width="350" height="18" rx="4" fill="#292929"/><text x="88" y="382" font-family="Arial,sans-serif" font-size="17" fill="#626262">Sensitive text redacted in the demo preview.</text></svg>

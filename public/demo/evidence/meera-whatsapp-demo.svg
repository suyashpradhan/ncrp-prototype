  <rect width="720" height="460" fill="#f8f7f5"/><rect x="40" y="36" width="640" height="388" rx="18" fill="#fff" stroke="#ded9d7"/>
  <text x="72" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#171717">WhatsApp conversation · Synthetic evidence</text>
  <rect x="72" y="108" width="470" height="66" rx="12" fill="#f2f0ed"/><text x="92" y="147" font-family="Arial,sans-serif" font-size="16" fill="#171717">Pay ₹499 registration fee to continue.</text>
  <rect x="72" y="190" width="470" height="66" rx="12" fill="#f2f0ed"/><text x="92" y="229" font-family="Arial,sans-serif" font-size="16" fill="#171717">Verification requires another ₹1,499.</text>
  <rect x="72" y="272" width="536" height="66" rx="12" fill="#fbe5e7"/><text x="92" y="311" font-family="Arial,sans-serif" font-size="16" fill="#711522">Now pay ₹18,000 as a refundable security deposit.</text>

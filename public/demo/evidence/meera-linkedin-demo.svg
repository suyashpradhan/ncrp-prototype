<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic LinkedIn job conversation</title><desc id="desc">A fictional recruiter moves a job conversation to WhatsApp.</desc>
  <rect width="720" height="460" fill="#f8f7f5"/><rect x="40" y="36" width="640" height="388" rx="18" fill="#fff" stroke="#ded9d7"/>
  <text x="72" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#171717">LinkedIn conversation · Synthetic evidence</text>
  <rect x="72" y="112" width="438" height="78" rx="12" fill="#f2f0ed"/><text x="92" y="143" font-family="Arial,sans-serif" font-size="16" fill="#171717">We saw your profile and have a job opening.</text><text x="92" y="169" font-family="Arial,sans-serif" font-size="16" fill="#171717">Please continue with our recruiter on WhatsApp.</text>
  <rect x="210" y="216" width="438" height="62" rx="12" fill="#fff5f5"/><text x="230" y="253" font-family="Arial,sans-serif" font-size="16" fill="#171717">Okay, please share the role details.</text>
  <text x="72" y="382" font-family="Arial,sans-serif" font-size="14" fill="#626262">Demo only · No real account or person</text>
</svg>
